version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wao_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: waoai
    ports:
      - "5435:5432"
    volumes:
      - wao_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wao_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - wao_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: wao_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wao_minio_data:/data
    command: server /data --console-address ":9001"

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    networks:
      - default
    ports:
      - "8081:8080"
    volumes:
      - ./backend/external/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    restart: always

  neo4j:
    image: neo4j:latest
    container_name: wao-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/waoplatform
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - wao_neo4j_data:/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wao-qdrant
    ports:
      - "6333:6333"
    volumes:
      - wao_qdrant_data:/qdrant/storage
    restart: always

  worker:
    build: ./backend
    container_name: wao_worker
    restart: always
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.celery_worker worker --loglevel=info --concurrency=5 --uid=nobody
    environment:
      - HOME=/tmp
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/waoai
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=waoplatform
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - redis
      - minio
      - neo4j
      - qdrant
      - postgres


  # backend:
  #   build: ./backend
  #   container_name: wao_backend
  #   restart: always
  #   volumes:
  #     - ./backend:/app
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/waoai
